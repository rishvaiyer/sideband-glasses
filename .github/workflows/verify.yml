name: Verify demo and iPhone build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: brew install xcodegen
      - run: xcodegen generate --spec ios/project.yml --project ios
      - run: xcodebuild -project ios/Sideband.xcodeproj -scheme Sideband -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - run: python3 tests/ios-smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: Sideband-iOS-Simulator
          path: |
            build/Build/Products/Debug-iphonesimulator/Sideband.app
            build/evidence/
            build/SidebandTests.xcresult
